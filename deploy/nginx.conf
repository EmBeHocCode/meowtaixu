worker_processes 1;
pid /srv/meowtaixu/run/nginx.pid;
error_log /srv/meowtaixu/logs/error.log warn;
events { worker_connections 512; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /srv/meowtaixu/logs/access.log;
    sendfile on;
    server_tokens off;
    server {
        listen 8082;
        server_name _;
        root /srv/meowtaixu/current/dist;
        index index.html;
        add_header X-Content-Type-Options nosniff;
        location / { try_files $uri $uri/ /index.html; }
        location /assets/ { try_files $uri =404; }
        location /media/ { try_files $uri =404; }
        location ~ /\. { deny all; }
    }
}
